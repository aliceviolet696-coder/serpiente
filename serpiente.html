<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Snake Xtreme Gamer</title>

  <link rel="stylesheet" href="serpiente.css">
</head>

<body>

  <main class="contenedor-juego">

    <h1>🔥 SNAKE XTREME 🔥</h1>

    <p class="descripcion">
      Sobrevive en la arena cyberpunk y domina la cuadrícula neon.
    </p>

    <section class="panel-info">

      <div class="tarjeta-info">
        <span>🏆 Puntaje</span>
        <strong id="puntaje">0</strong>
      </div>

      <div class="tarjeta-info">
        <span>⚡ Estado</span>
        <strong id="estado">READY</strong>
      </div>

    </section>

    <!-- Canvas -->
    <canvas id="canvasJuego" width="600" height="600"></canvas>

    <!-- Controles -->
    <section class="controles">

      <button class="vacio">-</button>
      <button onclick="cambiarDireccion('arriba')">⬆️</button>
      <button class="vacio">-</button>

      <button onclick="cambiarDireccion('izquierda')">⬅️</button>
      <button onclick="pausarJuego()">⏸️</button>
      <button onclick="cambiarDireccion('derecha')">➡️</button>

      <button class="vacio">-</button>
      <button onclick="cambiarDireccion('abajo')">⬇️</button>
      <button class="vacio">-</button>

    </section>

    <!-- Acciones -->
    <section class="acciones">

      <button onclick="iniciarJuego()">▶ INICIAR</button>

      <button class="secundario" onclick="reiniciarJuego()">
        🔄 REINICIAR
      </button>

    </section>

    <p id="mensaje" class="mensaje">
      Presiona iniciar para comenzar la partida.
    </p>

  </main>

  <script src="serpiente.js"></script>

</body>
</html>
